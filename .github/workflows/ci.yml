name: CloudPilot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:15

        env:
          POSTGRES_DB: cloudpilot
          POSTGRES_USER: cloudpilot
          POSTGRES_PASSWORD: cloudpilot

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest

      - name: Run Ruff
        run: |
          cd backend
          ruff check app

      - name: Check Formatting
        run: |
          cd backend
          black --check app

      - name: Create Test Environment File
        run: |
          cd backend

          cat > .env.test << EOF
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=cloudpilot
          POSTGRES_USER=cloudpilot
          POSTGRES_PASSWORD=cloudpilot

          REDIS_HOST=localhost
          REDIS_PORT=6379

          SECRET_KEY=test-secret-key
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF

      - name: Check Python Syntax
        run: |
          cd backend
          find app -name "*.py" -exec python -m py_compile {} \;

      - name: Run Database Migrations
        env:
          ENV: test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Tests with Coverage
        env:
          ENV: test
        run: |
          cd backend
          python -m pytest tests --cov=app --cov-report=term

      - name: Build Docker Image
        run: |
          docker build -t cloudpilot-api ./backend
