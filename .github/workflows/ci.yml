name: CloudPilot CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:15

        env:
          POSTGRES_DB: cloudpilot
          POSTGRES_USER: cloudpilot
          POSTGRES_PASSWORD: cloudpilot

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: |
          cd backend
          python -m ruff check . || true

      - name: Check Formatting
        run: |
          cd backend
          black --check app

      - name: Create Test Environment File
        run: |
          cd backend

          cat > .env.test <<'EOF'
      POSTGRES_HOST=localhost
      POSTGRES_PORT=5432
      POSTGRES_DB=cloudpilot
      POSTGRES_USER=cloudpilot
      POSTGRES_PASSWORD=cloudpilot

      REDIS_HOST=localhost
      REDIS_PORT=6379

      SECRET_KEY=test-secret-key
      ALGORITHM=HS256
      ACCESS_TOKEN_EXPIRE_MINUTES=30
      EOF

      - name: Check Python Syntax
        run: |
          cd backend
          find app -name "*.py" -exec python -m py_compile {} \;

      - name: Debug Environment
        env:
          ENV: test
        run: |
          cd backend

          python - <<EOF
      from app.config import *

      print("HOST =", POSTGRES_HOST)
      print("PORT =", POSTGRES_PORT)
      print("DB   =", POSTGRES_DB)
      print("USER =", POSTGRES_USER)
      EOF


      - name: Run Database Migrations
        env:
          ENV: test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Tests with Coverage
        env:
          ENV: test
        run: |
          cd backend
          python -m pytest tests --cov=app --cov-report=term

      - name: Build Docker Image
        run: |
          docker build -t cloudpilot-api ./backend

  publish-image:
    name: Build and Push Docker Image

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/rxmbtw/cloudpilot-api:${{ github.sha }}
            ghcr.io/rxmbtw/cloudpilot-api:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Minikube
    needs: publish-image
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Create values-secret.yaml
        run: |
          cat > helm/cloudpilot/values-secret.yaml <<EOF
          secrets:
            postgresUser: "${{ secrets.POSTGRES_USER }}"
            postgresPassword: "${{ secrets.POSTGRES_PASSWORD }}"
            secretKey: "${{ secrets.SECRET_KEY }}"
          EOF

      - name: Deploy with Helm
        run: |
          cd helm/cloudpilot
          helm upgrade --install cloudpilot . -f values-secret.yaml
