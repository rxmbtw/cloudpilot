{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.postgres.service.name }}

spec:
  type: ClusterIP

  selector:
    app: postgres

  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
      protocol: TCP
{{- end }}
